name: Run SmoothedLine cleanup

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      PYVISTA_OFF_SCREEN: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply, verify, and commit
        shell: bash
        run: |
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then
            echo "Bot-triggered verification commit; no further cleanup needed."
            exit 0
          fi

          python -m pip install -e ".[test]"
          python dev/onGoing/cleanup_smoothed_line_once.py
          python -m py_compile src/nematics3d/classes/smoothed_line.py
          python -m pytest tests/smooth/test_smoothed_line.py -q
          python -m black --check src/nematics3d/classes/smoothed_line.py tests/smooth/test_smoothed_line.py

          rm dev/onGoing/cleanup_smoothed_line_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/nematics3d/classes/smoothed_line.py tests/smooth/test_smoothed_line.py dev/onGoing/cleanup_smoothed_line_once.py
          git commit -m "Clean up SmoothedLine smoothing pipeline"
          git push origin HEAD:develop
