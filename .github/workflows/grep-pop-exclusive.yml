name: Grep pop_exclusive

on:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  grep:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Grep repository
        shell: bash
        run: |
          git grep -n -I -F "pop_exclusive" || true
