name: Verify SmoothedLineFunc delta optimization

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      PYVISTA_OFF_SCREEN: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply, test, and commit
        shell: bash
        run: |
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then
            echo "Bot-triggered source commit; skip repeat mutation."
            exit 0
          fi
          python -m pip install -e ".[test]"
          git grep -n "_linefunc_sample_delta_matrix" -- src tests || true
          python dev/onGoing/optimize_linefunc_delta_once.py
          python -m black src/nematics3d/classes/smoothed_line.py tests/smooth/test_smoothed_line_func.py
          python -m py_compile src/nematics3d/classes/smoothed_line.py
          python -m pytest tests/smooth/test_smoothed_line.py tests/smooth/test_smoothed_line_func.py -q
          python -m black --check src/nematics3d/classes/smoothed_line.py tests/smooth/test_smoothed_line_func.py
          if git grep -n "_linefunc_sample_delta_matrix" -- src tests; then
            echo "obsolete delta-matrix helper still present"
            exit 1
          fi
          rm dev/onGoing/optimize_linefunc_delta_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/nematics3d/classes/smoothed_line.py tests/smooth/test_smoothed_line_func.py dev/onGoing/optimize_linefunc_delta_once.py
          git commit -m "Stream SmoothedLineFunc sample deltas"
          git push origin HEAD:develop
