name: Update SmoothedLineFunc pending review record

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Update pending ledger and commit
        shell: bash
        run: |
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then
            echo "Bot-triggered ledger commit; skip repeat mutation."
            exit 0
          fi
          python dev/onGoing/update_pending_smoothed_line_func_once.py
          rm dev/onGoing/update_pending_smoothed_line_func_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PENDING_REVIEWED_COMPONENTS.md dev/onGoing/update_pending_smoothed_line_func_once.py
          git commit -m "Record SmoothedLineFunc delta optimization review"
          git push origin HEAD:develop
