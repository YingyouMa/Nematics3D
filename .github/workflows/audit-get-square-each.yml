name: Audit get_square_each callers
on:
  push:
    branches: [develop]
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: grep
        run: |
          echo '=== get_square_each ==='
          git grep -n 'get_square_each' -- ':!dev/backup/**' || true
          echo '=== get_square ==='
          git grep -n 'get_square(' -- ':!dev/backup/**' || true
