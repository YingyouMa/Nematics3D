name: One-shot SmoothedLine rename

on:
  push:
    branches:
      - develop
    paths:
      - .github/workflows/temp-rename-smoothed-line.yml

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - name: Check out develop
        uses: actions/checkout@v6
        with:
          ref: develop

      - name: Apply exact identifier renames repo-wide
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          replacements = {
              r"\bOptsSmooth\b": "OptsSmoothedLine",
              r"\bSmoothingConfigError\b": "LineSmoothingConfigError",
              r"\bline_coord_input\b": "coords",
              r"\bdr_dx\b": "dr_du",
          }
          suffixes = {".py", ".md", ".rst", ".txt", ".ipynb"}

          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts or path.suffix not in suffixes:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              new = text
              for pattern, replacement in replacements.items():
                  new = re.sub(pattern, replacement, new)
              if path.as_posix() == "src/nematics3d/classes/smoothed_line.py":
                  new = re.sub(
                      r"\n# Backward-compatible alias for existing imports; remove when the smoothing\n# subsystem is migrated to geometry/smoothing\.\nOptsSmoothedLine = OptsSmoothedLine\n",
                      "\n",
                      new,
                  )
              if new != text:
                  path.write_text(new, encoding="utf-8")

          old_tokens = ["OptsSmooth", "SmoothingConfigError", "line_coord_input", "dr_dx"]
          leftovers = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts or path.suffix not in suffixes:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              for token in old_tokens:
                  if re.search(rf"\b{re.escape(token)}\b", text):
                      leftovers.append(f"{path}: {token}")
          if leftovers:
              raise SystemExit("Old identifiers remain:\n" + "\n".join(leftovers))
          PY

      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          git rm .github/workflows/temp-rename-smoothed-line.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Finish SmoothedLine naming cleanup"
          git push origin HEAD:develop
