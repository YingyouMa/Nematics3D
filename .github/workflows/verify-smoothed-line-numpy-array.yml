name: Verify SmoothedLine NumPy array protocol

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply, inspect read-only helper, test, and commit
        shell: bash
        run: |
          if [ "$GITHUB_ACTOR" = "github-actions[bot]" ]; then
            echo "Bot-triggered source commit; skip repeat mutation."
            exit 0
          fi
          python -m pip install -e ".[test]"
          echo '--- as_read_only occurrences ---'
          git grep -n -E 'as_read_?only|read[_ -]?only' -- 'src/**/*.py' || true
          python dev/onGoing/fix_smoothed_line_numpy_array_once.py
          python -m black src/nematics3d/classes/smoothed_line.py tests/smooth/test_smoothed_line.py
          python -m py_compile src/nematics3d/classes/smoothed_line.py
          python -m pytest tests/smooth/test_smoothed_line.py -q
          python -m black --check src/nematics3d/classes/smoothed_line.py tests/smooth/test_smoothed_line.py
          rm dev/onGoing/fix_smoothed_line_numpy_array_once.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/nematics3d/classes/smoothed_line.py tests/smooth/test_smoothed_line.py dev/onGoing/fix_smoothed_line_numpy_array_once.py
          git commit -m "Support NumPy 2 array protocol in SmoothedLine"
          git push origin HEAD:develop
