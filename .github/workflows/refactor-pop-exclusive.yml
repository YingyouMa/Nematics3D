name: Verify HostBase refactor

on:
  push:
    branches:
      - develop

permissions:
  contents: read

jobs:
  verify:
    if: github.event.head_commit.message == 'Temporarily verify HostBase refactor'
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYVISTA_OFF_SCREEN: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test]"
      - name: Verify import and regression
        run: |
          python -m py_compile src/nematics3d/classes/host_base.py
          python -m pytest tests/smooth/test_smoothed_line.py -q
