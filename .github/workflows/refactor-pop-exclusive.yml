name: Refactor HostBase pop_exclusive

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  refactor:
    if: github.event.head_commit.message == 'Temporarily apply HostBase pop_exclusive refactor'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
      - name: Refactor HostBase helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/nematics3d/classes/host_base.py')
          s = p.read_text()
          s = s.replace('from ..general import pop_exclusive\n', '')
          needle = '    def _helper_commit_name(self, kwargs: dict[str, Any]) -> dict[str, Any]:\n'
          helper = '''    @staticmethod
              def _helper_pop_exclusive(
                  kwargs: dict[str, Any],
                  key1: str,
                  key2: str,
              ) -> tuple[bool, Any]:
                  """Pop one of two mutually exclusive keys from ``kwargs``."""
                  has1 = key1 in kwargs
                  has2 = key2 in kwargs
                  if has1 and has2:
                      raise TypeError(
                          f"Ambiguous input: both {key1!r} and {key2!r} were provided. "
                          "Please pass only one."
                      )
                  if has1:
                      return True, kwargs.pop(key1)
                  if has2:
                      return True, kwargs.pop(key2)
                  return False, None

          '''
          helper = '\n'.join(line[4:] if line.startswith('    ') else line for line in helper.splitlines()) + '\n'
          assert needle in s
          s = s.replace(needle, helper + needle, 1)
          s = s.replace('pop_exclusive(kwargs, "name", "raw_name")', 'self._helper_pop_exclusive(kwargs, "name", "raw_name")')
          s = s.replace('pop_exclusive(kwargs, public_attr_name, host_attr_name)', 'self._helper_pop_exclusive(kwargs, public_attr_name, host_attr_name)')
          p.write_text(s)
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/nematics3d/classes/host_base.py
          git commit -m "Move pop_exclusive into HostBase"
          git push origin HEAD:develop
