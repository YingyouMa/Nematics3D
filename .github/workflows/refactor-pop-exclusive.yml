name: Fix HostBase helper indentation

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  fix:
    if: github.event.head_commit.message == 'Temporarily fix HostBase helper indentation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: develop
      - name: Fix helper indentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/nematics3d/classes/host_base.py')
          s = p.read_text()
          start = s.index('\n@staticmethod\ndef _helper_pop_exclusive(') + 1
          end = s.index('    def _helper_commit_name(', start)
          block = s[start:end]
          block = '\n'.join(('    ' + line) if line else line for line in block.splitlines()) + '\n'
          s = s[:start] + block + s[end:]
          p.write_text(s)
          PY
          python -m py_compile src/nematics3d/classes/host_base.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/nematics3d/classes/host_base.py
          git commit -m "Fix HostBase helper indentation"
          git push origin HEAD:develop
