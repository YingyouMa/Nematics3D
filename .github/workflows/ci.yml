name: CI

on:
  push:
    branches:
      - main
      - droplet_dev
  pull_request:
    branches:
      - main
      - droplet_dev
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Reviewed code quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install quality tools
        run: python -m pip install black==25.1.0 ruff==0.12.5

      - name: Check Black formatting
        run: >-
          black --check
          src/nematics3d/q_diagonalization.py
          src/nematics3d/classes/result_base.py
          tests/core

      - name: Run Ruff
        run: >-
          ruff check --select E,F,W,N,I
          src/nematics3d/q_diagonalization.py
          src/nematics3d/classes/result_base.py
          tests/core

  core-tests:
    name: Core tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYVISTA_OFF_SCREEN: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e ".[test]"

      - name: Run required core tests
        run: python -m pytest tests/core -q

  package:
    name: Build and installed-package smoke test
    runs-on: ubuntu-latest
    needs:
      - quality
      - core-tests
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build frontend
        run: python -m pip install "build>=1.2,<2"

      - name: Build source distribution and wheel
        run: python -m build

      - name: Install wheel
        shell: bash
        run: python -m pip install --force-reinstall dist/*.whl

      - name: Smoke-test installed public API outside the repository
        shell: bash
        run: |
          smoke_dir="$(mktemp -d)"
          cd "$smoke_dir"
          python - <<'PY'
          import numpy as np
          import nematics3d

          q_tensor = np.diag([0.5, -0.25, -0.25])
          result = nematics3d.q_diagonalize(q_tensor, log_mode="none")

          assert np.isclose(result.S, 0.75)
          assert np.isclose(abs(result.n[0]), 1.0)
          PY

      - name: Upload built distributions
        uses: actions/upload-artifact@v7
        with:
          name: nematics3d-distributions
          path: dist/*
          if-no-files-found: error
