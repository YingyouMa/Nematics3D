name: Cleanup SmoothedLine

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    env:
      QT_QPA_PLATFORM: offscreen
      PYVISTA_OFF_SCREEN: "true"
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply focused SmoothedLine cleanup
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/nematics3d/classes/smoothed_line.py")
          text = path.read_text()

          old = '"window_ratio":         lambda v, d: None if v is None else as_number(v, name=d),'
          new = '"window_ratio":         lambda v, d: None if v is None else as_number(v, name=d, value_range=(1e-12, np.inf)),'
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = '''        if kwargs:\n            if "window_ratio" in kwargs and "window_length" not in kwargs:\n                object.__setattr__(self.opts, "window_length", None)\n            if "window_ratio" not in kwargs and "window_length" in kwargs:\n                object.__setattr__(self.opts, "window_ratio", None)\n\n        with self.opts.act_internal_update():\n            cover_value(\n                self.opts,\n                is_allow_cover_target_set=True,\n                is_allow_unset_source=False,\n                **kwargs,\n            )\n'''
          new = '''        with self.opts.act_internal_update():\n            if kwargs:\n                if "window_ratio" in kwargs and "window_length" not in kwargs:\n                    self.opts.window_length = None\n                if "window_ratio" not in kwargs and "window_length" in kwargs:\n                    self.opts.window_ratio = None\n\n            cover_value(\n                self.opts,\n                is_allow_cover_target_set=True,\n                is_allow_unset_source=False,\n                **kwargs,\n            )\n'''
          assert text.count(old) == 1
          text = text.replace(old, new)

          marker = '''    def _helper_fallback_no_smooth(self, reason: str) -> None:\n        object.__setattr__(self, "calc_is_smoothed", False)\n        object.__setattr__(self, "calc_result", self.calc_coords)\n        object.__setattr__(self, "entity_tck", None)\n        object.__setattr__(\n            self,\n            "calc_status",\n            f"The line `{self.name}` is not smoothed, reason: {reason}.",\n        )\n'''
          addition = marker + '''\n    def _helper_resolve_window_opts(self, *, logger=None) -> None:\n        """Resolve the active smoothing window and synchronize both window opts."""\n        window_length = self.opts.window_length\n        window_ratio = self.opts.window_ratio\n\n        if window_length is None:\n            if window_ratio is None:\n                raise SmoothingConfigError(\n                    "No input value provided for smooth window length."\n                )\n            if self.calc_num_init <= 0:\n                raise SmoothingConfigError("Cannot smooth an empty line.")\n            window_length = int(self.calc_num_init / window_ratio / 2) * 2 + 1\n        else:\n            if window_ratio is not None and self.state_is_window_warning and logger is not None:\n                logger.warning(\n                    f"Window_length is manual input as {window_length}. "\n                    f"window_ratio ({window_ratio}) would be ignored and reset."\n                )\n            window_length = int(window_length)\n            if window_length % 2 == 0:\n                window_length += 1\n\n        resolved_ratio = self.calc_num_init / window_length\n        with self.opts.act_internal_update():\n            self.opts.window_length = window_length\n            self.opts.window_ratio = resolved_ratio\n\n    def _helper_resolve_spline_u(self, u_percent) -> float:\n        """Validate a percent spline parameter and map it to FITPACK's [0, 1] domain."""\n        if getattr(self, "entity_tck", None) is None:\n            raise RuntimeError(\n                "Spline cache `entity_tck` is missing. "\n                "Probably the line is not properly initialized or successfully smoothed."\n            )\n\n        u_percent = as_number(\n            u_percent,\n            value_range=(0, 100),\n            name="Continuous spline parameter along the curve",\n        )\n        u = float(u_percent) / 100.0\n        if self.opts.mode == "wrap":\n            u = float(np.mod(u, 1.0))\n        return u\n'''
          assert text.count(marker) == 1
          text = text.replace(marker, addition)

          old = '''        try:\n            if self.opts.window_length is None:\n                if self.opts.window_ratio is None:\n                    reason = "No input value provided for smooth window length."\n                    raise SmoothingConfigError(reason)\n                object.__setattr__(\n                    self.opts,\n                    "window_length",\n                    int(self.calc_num_init / self.opts.window_ratio / 2) * 2 + 1,\n                )\n                object.__setattr__(\n                    self.opts,\n                    "window_ratio",\n                    self.calc_num_init / self.opts.window_length,\n                )\n            else:\n                if self.opts.window_ratio is not None and self.state_is_window_warning:\n                    logger.warning(\n                        f"Window_length is manual input as {self.opts.window_length}. "\n                        f"window_ratio ({self.opts.window_ratio}) would be ignored and reset."\n                    )\n                window_length = int(self.opts.window_length)\n                if window_length % 2 == 0:\n                    window_length += 1\n                object.__setattr__(self.opts, "window_length", window_length)\n                object.__setattr__(\n                    self.opts,\n                    "window_ratio",\n                    self.calc_num_init / self.opts.window_length,\n                )\n\n            if self.calc_num_init < self.opts.min_line_length:\n'''
          new = '''        try:\n            self._helper_resolve_window_opts(logger=logger)\n\n            if self.calc_num_init < self.opts.min_line_length:\n'''
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = '''                self._helper_fallback_no_smooth(reason)\n                raise SmoothingConfigError(reason)\n'''
          new = '''                raise SmoothingConfigError(reason)\n'''
          assert text.count(old) == 1
          text = text.replace(old, new)

          old = '''    def act_calc_tangent(self, u_percent, is_return_coord=False):\n\n        tck = getattr(self, "entity_tck", None)\n        if tck is None:\n            raise RuntimeError(\n                "Spline cache `entity_tck` is missing."\n                "Probably the line is not properly initialized or successfully smoothed."\n            )\n\n        u_percent = as_number(\n            u_percent,\n            value_range=(0, 100),\n            name="Continuous spline parameter along the curve",\n        )\n        u_percent /= 100\n        if self.opts.mode == "wrap":\n            u_percent = np.mod(u_percent, 1.0)\n        dr_dx = np.asarray(splev(u_percent, self.entity_tck, der=1), dtype=float)\n        length = float(np.linalg.norm(dr_dx))\n        if (not np.isfinite(length)) or length < 1e-9:\n            raise ValueError(\n                f"Degenerate spline derivative at {u_percent}: ||dr/dx||={length}."\n            )\n\n        t_hat = dr_dx / length\n        if not is_return_coord:\n            return t_hat\n\n        coord = np.asarray(splev(u_percent, self.entity_tck, der=0), dtype=float)\n        return t_hat, coord\n\n    def act_calc_pos(self, u_percent):\n        tck = getattr(self, "entity_tck", None)\n        if tck is None:\n            raise RuntimeError(\n                "Spline cache `entity_tck` is missing."\n                "Probably the line is not properly initialized or successfully smoothed."\n            )\n\n        u_percent = as_number(\n            u_percent,\n            value_range=(0, 100),\n            name="Continuous spline parameter along the curve",\n        )\n        u_percent /= 100\n        if self.opts.mode == "wrap":\n            u_percent = np.mod(u_percent, 1.0)\n\n        return np.asarray(splev(u_percent, self.entity_tck, der=0), dtype=float)\n'''
          new = '''    def act_calc_tangent(self, u_percent, is_return_coord=False):\n        u = self._helper_resolve_spline_u(u_percent)\n        is_return_coord = as_bool(\n            is_return_coord,\n            name="Whether to return the spline coordinate",\n        )\n\n        dr_dx = np.asarray(splev(u, self.entity_tck, der=1), dtype=float)\n        length = float(np.linalg.norm(dr_dx))\n        if (not np.isfinite(length)) or length < 1e-9:\n            raise ValueError(\n                f"Degenerate spline derivative at {u}: ||dr/dx||={length}."\n            )\n\n        t_hat = dr_dx / length\n        if not is_return_coord:\n            return t_hat\n\n        coord = np.asarray(splev(u, self.entity_tck, der=0), dtype=float)\n        return t_hat, coord\n\n    def act_calc_pos(self, u_percent):\n        u = self._helper_resolve_spline_u(u_percent)\n        return np.asarray(splev(u, self.entity_tck, der=0), dtype=float)\n'''
          assert text.count(old) == 1
          text = text.replace(old, new)

          path.write_text(text)
          PY

      - name: Add focused regression coverage
        shell: bash
        run: |
          cat >> tests/smooth/test_smoothed_line.py <<'PY'


def test_smoothed_line_window_resolution_and_fallback_contract():
    """Cover window normalization plus representative recoverable fallbacks."""
    _, noisy = _build_noisy_line()

    ratio_line = SmoothedLine(
        noisy,
        window_ratio=15,
        order=3,
        num_out_ratio=1,
        min_line_length=2,
        mode="interp",
    )
    assert ratio_line.calc_is_smoothed is True
    assert ratio_line.opts.window_length == 9
    np.testing.assert_allclose(
        ratio_line.opts.window_ratio,
        ratio_line.calc_num_init / ratio_line.opts.window_length,
    )

    even_line = SmoothedLine(
        noisy,
        window_length=8,
        order=3,
        num_out_ratio=1,
        min_line_length=2,
        mode="interp",
    )
    assert even_line.calc_is_smoothed is True
    assert even_line.opts.window_length == 9

    short_line = SmoothedLine(
        noisy[:8],
        window_length=5,
        order=3,
        min_line_length=50,
        mode="interp",
    )
    assert short_line.calc_is_smoothed is False
    assert short_line.entity_tck is None
    np.testing.assert_array_equal(short_line.result, short_line.calc_coords)
    assert "minimum length" in short_line.calc_status.lower()


def test_smoothed_line_query_helpers_and_wrap_boundary():
    """Keep position/tangent parameter handling shared and periodic at 100%."""
    _, noisy = _build_noisy_line()
    line = SmoothedLine(
        noisy,
        window_length=9,
        order=3,
        num_out_ratio=1,
        min_line_length=2,
        mode="wrap",
    )

    np.testing.assert_allclose(line.act_calc_pos(100), line.act_calc_pos(0), atol=1e-12)
    tangent, coord = line.act_calc_tangent(100, is_return_coord=True)
    np.testing.assert_allclose(coord, line.act_calc_pos(0), atol=1e-12)
    np.testing.assert_allclose(np.linalg.norm(tangent), 1.0, atol=1e-12)


def test_smoothed_line_zero_window_ratio_does_not_reach_division():
    """A non-positive ratio must be rejected by opts validation before smoothing math."""
    _, noisy = _build_noisy_line()
    line = SmoothedLine(
        noisy,
        window_ratio=0,
        order=3,
        min_line_length=2,
        mode="interp",
    )
    assert line.calc_is_smoothed is False
    assert line.entity_tck is None
    assert "no input value" in line.calc_status.lower()
PY

      - name: Install package and tests
        run: python -m pip install -e ".[test]"
      - name: Verify focused cleanup
        run: |
          python -m py_compile src/nematics3d/classes/smoothed_line.py
          python -m pytest tests/smooth/test_smoothed_line.py -q
          python -m black --check src/nematics3d/classes/smoothed_line.py tests/smooth/test_smoothed_line.py
      - name: Commit verified cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/nematics3d/classes/smoothed_line.py tests/smooth/test_smoothed_line.py
          git commit -m "Clean up SmoothedLine smoothing pipeline"
          git push origin HEAD:develop
