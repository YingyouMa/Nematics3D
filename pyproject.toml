[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nematics3d"
version = "0.9.0b1"
description = "Tools for 3D nematic field analysis and visualization"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Yingyou Ma" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy==2.3.2",
    "scipy==1.16.0",
    "pyvista==0.46.4",
]

[project.optional-dependencies]
gui      = ["vtk==9.3.1", "PyQt5==5.15.11", "pyvistaqt==0.11.3", "qtpy==2.4.1"]
tutorials = ["jupyter", "notebook"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/YingyouMa/Nematics3D"
Issues = "https://github.com/YingyouMa/Nematics3D/issues"
