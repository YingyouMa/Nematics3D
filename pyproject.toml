[build-system]
requires = ["setuptools>=61", "numpy>=2.3,<3"]
build-backend = "setuptools.build_meta"

[project]
name = "nematics3d"
version = "0.9.0b1"
description = "Tools for 3D nematic field analysis and visualization"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Yingyou Ma" }]
license = { text = "MIT" }
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=2.3,<3",
    "numexpr>=2.14,<3",
    "scipy>=1.16,<2",
    "pyvista>=0.46,<1",
    "vtk>=9.3,<10",
]

[project.optional-dependencies]
gui = [
    "pyvistaqt>=0.11.4,<1",
    "qtpy>=2.4,<3",
    "PyQt6>=6.7,<7",
]
tutorials = ["jupyter", "notebook"]
test = [
    "black==25.1.0",
    "build>=1.2,<2",
    "pytest>=9,<10",
    "ruff==0.12.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "visual: tests that require rendering, GUI, or off-screen graphics support",
    "slow: tests that are unsuitable for the required per-push core suite",
    "benchmark: performance measurements that do not gate correctness",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Homepage = "https://github.com/YingyouMa/Nematics3D"
Issues = "https://github.com/YingyouMa/Nematics3D/issues"
