[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nematics3d-mcp"
version = "0.1.0"
description = "Private MCP bridge for the local Nematics3D repository"
requires-python = ">=3.12,<3.13"
dependencies = ["mcp>=1.13,<2"]

[project.scripts]
nematics3d-mcp = "nematics3d_mcp.server:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
